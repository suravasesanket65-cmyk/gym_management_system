{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CORESA Fitness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body class="auth-body">

  <div class="glass-card">
    <a href="{% url 'home' %}" class="back-home-link">
      ← Back to Home
    </a>

    <div class="auth-header">
      <a href="{% url 'home' %}" class="auth-logo">CORE<span>SA</span></a>
      <h2>Welcome Back</h2>
      <p>Sign in to your account to continue</p>
    </div>

    <form class="auth-form" method="POST" action="{% url 'login' %}">
      {% csrf_token %}

      {% if messages %}
        {% for message in messages %}
          <div style="background: rgba(255,75,31,0.15); border: 1px solid var(--neon-orange); color: var(--text-main); padding: 12px; border-radius: 6px; font-size: 13px; text-align: center;">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <div class="form-group">
        <label for="username">Username or Email</label>
        <div class="form-input-wrapper">
          <input type="text" id="username" name="username" placeholder="Enter your username or email" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="form-input-wrapper">
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" name="remember_me">
          <span>Remember Me</span>
        </label>
        <a href="#" class="forgot-link" onclick="alert('Password reset instructions will be sent to your registered email.')">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        Login
      </button>
    </form>

    <div class="auth-footer-text">
      Don't have an account? <a href="{% url 'register' %}">Join Now</a>
    </div>
  </div>

</body>
</html>
